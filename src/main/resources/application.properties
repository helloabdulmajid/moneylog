spring.application.name=moneylog
#spring.profiles.active=local

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# Session (backend-managed sliding sessions)
session.inactivity-timeout=1036800000
session.absolute-lifetime=5184000000

# Mail (SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM}
app.mail.log-fallback=false
# Feedback notification recipient
app.feedback.recipient=${FEEDBACK_RECIPIENT:${app.mail.from}}

# Feedback notification recipient: FEEDBACK_RECIPIENT overrides app.mail.from
# when set (falls back to app.mail.from if missing or blank). The SMTP sender
# is always app.mail.from. Only applies to feedback notifications.

# Multipart (feedback screenshots)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Server
server.port=8080
server.servlet.context-path=/api

# SpringDoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
